name: Release

on:
  push:
    tags:
      - 'v*'      # Triggers on tags like v4.1.0

jobs:
  test:
    name: Run Tests before Build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r config/requirements/requirements-ci.txt
          pip install pytest

      - name: Run Pytest
        run: pytest tests/ -v --tb=short
        env:
          TESTING: true
          ENVIRONMENT: development
          PYTHONPATH: core_ai/src;backend
          ADMIN_PIN: ${{ secrets.ADMIN_PIN || '123456' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'changeme123' }}

  build-exe:
    name: Build Windows Executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install full dependencies
        run: |
          pip install -r config/requirements/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name="YourDaddy_Assistant" `
            --windowed `
            --icon="assets\icon.ico" `
            --add-data="config;config" `
            --add-data="data;data" `
            --add-data="frontend\web-app\dist;web_assets" `
            --paths="core_ai\src\ai_assistant" `
            --paths="core_ai\src\ai_assistant\modules" `
            --hidden-import="ai_assistant.multimodal" `
            --hidden-import="ai_assistant.modules.conversational_ai" `
            --hidden-import="ai_assistant.multilingual" `
            --hidden-import="ai_assistant.modules.advanced_chat_system" `
            --hidden-import="ai_assistant.modules.llm_provider" `
            --hidden-import="webview" `
            --hidden-import="flask" `
            --hidden-import="flask_socketio" `
            --hidden-import="engineio.async_drivers.threading" `
            --exclude-module="tensorflow" `
            --exclude-module="torch" `
            --exclude-module="torchvision" `
            --exclude-module="torchaudio" `
            --exclude-module="numba" `
            --exclude-module="llvmlite" `
            --exclude-module="scipy" `
            --exclude-module="sklearn" `
            --exclude-module="scikit-learn" `
            --exclude-module="cv2" `
            --exclude-module="opencv-python" `
            --exclude-module="onnxruntime" `
            --exclude-module="pvporcupine" `
            --exclude-module="matplotlib" `
            --onedir `
            --noconfirm `
            --clean `
            desktop\app_launcher.py

      - name: Zip the build
        run: Compress-Archive -Path dist\YourDaddy_Assistant -DestinationPath YourDaddy_Assistant_${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: YourDaddy_Assistant_${{ github.ref_name }}.zip

  create-release:
    name: Create GitHub Release
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-build

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          # Handle multiline output safely for GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changes<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YourDaddy Assistant ${{ github.ref_name }}"
          body: |
            ## What's New in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changes }}

            ## Download
            Download `YourDaddy_Assistant_${{ github.ref_name }}.zip`, extract, and run `YourDaddy_Assistant.exe`.

            ## Requirements
            - Windows 10/11
            - No Python installation needed (everything bundled)
          files: YourDaddy_Assistant_${{ github.ref_name }}.zip
          draft: false
          prerelease: false
