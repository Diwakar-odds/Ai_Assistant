name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements/requirements-ci.txt
        pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-mock pytest-asyncio

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: |
        pytest tests/ -v --tb=short
      env:
        TESTING: true
        ENVIRONMENT: development
        PYTHONPATH: core_ai/src:backend
        ADMIN_PIN: "123456"
        ADMIN_PASSWORD: changeme123

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: |
        pytest tests/ -v --tb=short
      env:
        TESTING: true
        ENVIRONMENT: development
        PYTHONPATH: core_ai/src;backend
        ADMIN_PIN: "123456"
        ADMIN_PASSWORD: changeme123

    - name: Run tests with coverage (Ubuntu + Python 3.11 only)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        pytest tests/ --cov=core_ai/src/ai_assistant --cov-report=xml --cov-report=html --cov-report=term
      env:
        TESTING: true
        ENVIRONMENT: development
        PYTHONPATH: core_ai/src:backend
        ADMIN_PIN: "123456"
        ADMIN_PASSWORD: changeme123
        JWT_SECRET_KEY: test-secret-key-for-ci
        SECRET_KEY: test-secret-key-for-ci

  test-frontend:
    name: Frontend Typecheck & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/web-app/package.json'

    - name: Install dependencies
      working-directory: frontend/web-app
      run: npm ci || npm install

    - name: Typecheck TypeScript
      working-directory: frontend/web-app
      run: npm run typecheck

    - name: Run Vitest Unit Tests
      working-directory: frontend/web-app
      run: npm test

    - name: Build Web Application
      working-directory: frontend/web-app
      run: npm run build

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint
    
    - name: Run flake8 (errors only)
      run: |
        flake8 core_ai/src/ai_assistant/ backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check --diff core_ai/src/ai_assistant/ backend/
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run bandit security scan
      run: |
        bandit -r core_ai/src/ai_assistant/ backend/ -f json -o bandit-report.json || true
      continue-on-error: true