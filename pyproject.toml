[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "4.0.0"
description = "Production-grade Intelligent AI Assistant with Voice, Automation, and Web Interface"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Assistant Team"}
]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-jwt-extended>=4.5.0",
    "flask-socketio>=5.3.0",
    "flask-limiter>=3.3.0",
    "requests>=2.28.0",
    "speechrecognition>=3.10.0",
    "pyttsx3>=2.90",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "python-dateutil>=2.8.2",
    "werkzeug>=2.3.0",
    "colorama>=0.4.6",
    "pywin32>=306; platform_system=='Windows'",
]

[project.optional-dependencies]
voice = [
    "vosk",
    "pyaudio",
    "webrtcvad",
]
ai = [
    "openai",
    "anthropic",
    "google-generativeai",
    "llama-cpp-python",
]
desktop = [
    "pywebview>=4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
ai-assistant = "ai_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core_ai*", "backend*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.html", "*.css", "*.js"]

